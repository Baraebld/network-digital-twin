# Network Topology Specification
# Reference: Sections 1.1 - 1.5, Figures 1-4 of Rapport_TP_Reseau.pdf

vlans:
  10:
    name: "Management_SW1"
    subnet: "192.168.10.0/24"
    gateway: "192.168.10.1"
    description: "Management network for Switch A / SW1"
  20:
    name: "Utilisateurs_A"
    subnet: "192.168.20.0/24"
    gateway: "192.168.20.1"
    description: "User segment A connected to Switch A"
  30:
    name: "Management_SW2"
    subnet: "192.168.30.0/24"
    gateway: "192.168.30.1"
    description: "Management network for Switch B / SW2 and Router"
  40:
    name: "Utilisateurs_B"
    subnet: "192.168.40.0/24"
    gateway: "192.168.40.1"
    description: "User segment B connected to Switch B"

devices:
  ROUTER-GW:
    aliases: ["R1", "Router0", "R1.lab.local"]
    type: "router"
    hostname: "R1.lab.local"
    primary_ip: "192.168.10.1"
    is_reachable: true
    physical_interfaces:
      GigabitEthernet0/0:
        oper_status: "UP"
        admin_status: "UP"
        connected_to: "SWITCH-A:GigabitEthernet1/0/1"
      GigabitEthernet0/1:
        oper_status: "UP"
        admin_status: "UP"
        connected_to: "SWITCH-B:GigabitEthernet1/0/1"
      GigabitEthernet0/3:
        oper_status: "UP"
        admin_status: "UP"
    subinterfaces:
      GigabitEthernet0/0.10:
        vlan: 10
        ip_address: "192.168.10.1"
        subnet_mask: "255.255.255.0"
        oper_status: "UP"
      GigabitEthernet0/0.20:
        vlan: 20
        ip_address: "192.168.20.1"
        subnet_mask: "255.255.255.0"
        oper_status: "UP"
      GigabitEthernet0/1.30:
        vlan: 30
        ip_address: "192.168.30.1"
        subnet_mask: "255.255.255.0"
        oper_status: "UP"
      GigabitEthernet0/1.40:
        vlan: 40
        ip_address: "192.168.40.1"
        subnet_mask: "255.255.255.0"
        oper_status: "UP"
    dhcp_pools:
      VLAN10:
        network: "192.168.10.0"
        netmask: "255.255.255.0"
        default_router: "192.168.10.1"
        dns_server: "8.8.8.8"
        excluded_addresses: ["192.168.10.1", "192.168.10.2"]
      VLAN20:
        network: "192.168.20.0"
        netmask: "255.255.255.0"
        default_router: "192.168.20.1"
        dns_server: "8.8.8.8"
        excluded_addresses: ["192.168.20.1", "192.168.20.2"]
      VLAN30:
        network: "192.168.30.0"
        netmask: "255.255.255.0"
        default_router: "192.168.30.1"
        dns_server: "8.8.8.8"
        excluded_addresses: ["192.168.30.1", "192.168.30.2"]
      VLAN40:
        network: "192.168.40.0"
        netmask: "255.255.255.0"
        default_router: "192.168.40.1"
        dns_server: "8.8.8.8"
        excluded_addresses: ["192.168.40.1", "192.168.40.2"]

  SWITCH-A:
    aliases: ["SW1", "Switch0", "SW-A", "SW-A.lab.local"]
    type: "switch"
    hostname: "SW-A.lab.local"
    primary_ip: "192.168.10.2"
    management_vlan: 10
    is_reachable: true
    svis:
      Vlan1:
        oper_status: "DOWN"
      Vlan10:
        oper_status: "UP"
        ip_address: "192.168.10.2"
        subnet_mask: "255.255.255.0"
    ports:
      GigabitEthernet1/0/1:
        mode: "trunk"
        allowed_vlans: [10, 20, 30, 40]
        oper_status: "UP"
        admin_status: "UP"
        connected_to: "ROUTER-GW:GigabitEthernet0/0"
      GigabitEthernet1/0/7:
        mode: "access"
        access_vlan: 10
        oper_status: "UP"
        admin_status: "UP"
        connected_host: "192.168.10.10"
      GigabitEthernet1/0/17:
        mode: "access"
        access_vlan: 20
        oper_status: "UP"
        admin_status: "UP"
        connected_host: "192.168.20.3"
      FastEthernet0:
        mode: "routed"
        oper_status: "DOWN"
        admin_status: "DOWN"

  SWITCH-B:
    aliases: ["SW2", "Switch1", "SW-B", "SW-B.lab.local"]
    type: "switch"
    hostname: "SW-B.lab.local"
    primary_ip: "192.168.30.2"
    management_vlan: 30
    is_reachable: true
    svis:
      Vlan1:
        oper_status: "DOWN"
      Vlan30:
        oper_status: "UP"
        ip_address: "192.168.30.2"
        subnet_mask: "255.255.255.0"
    ports:
      GigabitEthernet1/0/1:
        mode: "trunk"
        allowed_vlans: [10, 20, 30, 40]
        oper_status: "UP"
        admin_status: "UP"
        connected_to: "ROUTER-GW:GigabitEthernet0/1"
      GigabitEthernet1/0/5:
        mode: "access"
        access_vlan: 30
        oper_status: "UP"
        admin_status: "UP"
        connected_host: "192.168.30.3"
      GigabitEthernet1/0/13:
        mode: "access"
        access_vlan: 40
        oper_status: "UP"
        admin_status: "UP"
        connected_host: "192.168.40.3"
      FastEthernet0:
        mode: "routed"
        oper_status: "DOWN"
        admin_status: "DOWN"

hosts:
  "192.168.10.10":
    name: "PC-VLAN10"
    vlan: 10
    gateway: "192.168.10.1"
    connected_to: "SWITCH-A:GigabitEthernet1/0/7"
  "192.168.20.3":
    name: "PC-VLAN20"
    vlan: 20
    gateway: "192.168.20.1"
    connected_to: "SWITCH-A:GigabitEthernet1/0/17"
  "192.168.30.3":
    name: "PC-VLAN30"
    vlan: 30
    gateway: "192.168.30.1"
    connected_to: "SWITCH-B:GigabitEthernet1/0/5"
  "192.168.40.3":
    name: "PC-VLAN40"
    vlan: 40
    gateway: "192.168.40.1"
    connected_to: "SWITCH-B:GigabitEthernet1/0/13"
